# Read by the framework (GnssConfiguration) on top of carrier config.
#
# XTRA predicted orbits for the GNSS HAL's IGnssXtra (android/2.1/GnssXtra.cpp,
# no xtra-daemon). The framework downloads this once per boot and whenever the
# HAL asks, only while Settings > Location > "Use assisted GPS" is on.
# The modem lists http://xtrapath{1,2,3}.izatcloud.net/xtra3grc.bin, but that
# file fails on its last part through QMI_LOC_INJECT_PREDICTED_ORBITS_DATA on
# MSM8937 modems (INVALID_PARAMETER); the xtracloud.net xtra3grc.bin injects
# whole (bench, dut1, 2026-11-01).
LONGTERM_PSDS_SERVER_1=https://path1.xtracloud.net/xtra3grc.bin
LONGTERM_PSDS_SERVER_2=https://path2.xtracloud.net/xtra3grc.bin
LONGTERM_PSDS_SERVER_3=https://path3.xtracloud.net/xtra3grc.bin
